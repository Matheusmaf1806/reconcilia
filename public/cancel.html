<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout canceled — reconcilia</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#17120f;--paper:#f7f2e9;--muted:#7e7064;--red:#b93632;--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',Arial,sans-serif}
    *{box-sizing:border-box}
    body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{max-width:480px;width:100%;background:#fffaf2;border:1px solid rgba(23,18,15,.14);border-radius:6px;padding:42px 36px;text-align:center}
    h1{font:500 clamp(28px,5vw,36px)/1.1 var(--serif);letter-spacing:-.03em;margin:0 0 14px}
    p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 20px}
    a.btn{display:inline-block;background:var(--red);color:#fff4ea;padding:14px 22px;border-radius:999px;text-decoration:none;font-weight:700;font-size:13px}
  </style>
</head>
<body>
  <div class="card">
    <h1>No payment was made.</h1>
    <p>Your checkout was canceled and your card was not charged. Your box is still waiting whenever you're ready.</p>
    <a class="btn" href="/#boxes">Back to the boxes →</a>
  </div>
</body>
</html>
