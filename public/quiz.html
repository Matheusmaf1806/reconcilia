<style>
:root{--ink:#17120f;--paper:#f7f2e9;--cream:#fffaf2;--muted:#75675c;--red:#b93632;--yellow:#e6b84f;--line:rgba(23,18,15,.14);--serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',Arial,sans-serif;--mono:'DM Mono',monospace}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);min-height:100vh}.shell{width:min(920px,calc(100% - 32px));margin:auto}.top{height:82px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font:600 25px var(--serif);letter-spacing:-.05em;text-decoration:none;color:inherit}.brand i{font-style:normal;color:var(--red)}.locale{border:0;background:transparent;font:12px var(--mono);letter-spacing:.1em;color:var(--muted);padding:7px}.progress{height:3px;background:#e5dbce}.progress b{display:block;height:100%;background:var(--red);transition:width .35s ease}.stage{padding:54px 0 70px}.card{max-width:760px;margin:auto;animation:enter .35s ease}.eyebrow{font:11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:15px}.step{font:11px var(--mono);letter-spacing:.1em;color:var(--muted);margin-bottom:18px}.step span{color:var(--red)}h1,h2{font:500 clamp(39px,6vw,64px)/.98 var(--serif);letter-spacing:-.065em;margin:0 0 17px}h2{font-size:clamp(33px,4.5vw,49px)}p{font-size:16px;line-height:1.6;color:var(--muted);margin:0}.lead{max-width:570px;font-size:18px}.action{border:1px solid var(--ink);background:var(--ink);color:var(--paper);padding:15px 22px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;transition:.2s}.action:hover{background:var(--red);border-color:var(--red);transform:translateY(-2px)}.action:disabled{opacity:.55;cursor:not-allowed;transform:none}.action.secondary{background:transparent;color:var(--ink)}.entry{padding:68px 0 80px;max-width:640px}.entry .action{margin-top:31px}.proof{display:flex;flex-wrap:wrap;gap:13px 25px;margin-top:27px;font-size:12px;color:var(--muted)}.proof span:before{content:'✓';color:var(--red);font-weight:bold;margin-right:7px}.choices{display:grid;gap:10px;margin-top:28px}.choice{width:100%;text-align:left;background:var(--cream);border:1px solid var(--line);padding:20px 21px;cursor:pointer;transition:.18s;font:inherit;color:inherit}.choice:hover,.choice.selected{border-color:var(--red);box-shadow:4px 5px 0 rgba(185,54,50,.13);transform:translateY(-2px)}.choice strong{display:block;font:600 20px var(--serif);letter-spacing:-.02em}.choice small{display:block;font-size:13px;color:var(--muted);margin-top:4px}.reflection{margin:25px 0 0;border-left:3px solid var(--yellow);padding:15px 19px;background:#f0e4ce;max-width:650px;color:#55473d;font:500 18px/1.45 var(--serif);white-space:pre-line}.continue-row{display:flex;align-items:center;gap:14px;margin-top:25px}.back{border:0;background:none;color:var(--muted);font:13px var(--sans);cursor:pointer;padding:12px 0}.packages{grid-template-columns:repeat(2,1fr);gap:17px}.box{background:var(--cream);border:1px solid var(--line);text-align:left;padding:0;cursor:pointer;overflow:hidden;position:relative;transition:.2s}.box:hover,.box.selected{border-color:var(--red);box-shadow:7px 8px 0 rgba(185,54,50,.13);transform:translateY(-3px)}.box img{width:100%;height:155px;object-fit:cover}.box-copy{padding:17px}.box .price{font:600 21px var(--serif);color:var(--red);float:right}.box h3{font:600 22px var(--serif);letter-spacing:-.03em;margin:0}.box p{font-size:13px;line-height:1.45;margin:10px 0}.box ul{padding:0;margin:0;list-style:none;color:var(--muted);font-size:11px;line-height:1.65}.tag{position:absolute;top:12px;left:12px;background:var(--red);color:#fff;padding:5px 7px;font:10px var(--mono);letter-spacing:.04em}.empathy{background:var(--ink);color:var(--paper);padding:39px;max-width:680px}.empathy p{color:#d0c0b1;font-size:16px;margin:12px 0}.gift{border-top:1px solid rgba(255,255,255,.22);border-bottom:1px solid rgba(255,255,255,.22);padding:20px 0;margin:25px 0}.gift b{font:500 28px var(--serif);color:var(--yellow)}.gift span{display:block;color:#d0c0b1;font-size:13px;line-height:1.55;margin-top:7px}.form{max-width:560px;margin-top:26px}.field{margin:13px 0}.field label{display:block;font:11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--cream);border-radius:2px;padding:14px;color:var(--ink);font:inherit;outline:0}.field input:focus,.field textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(185,54,50,.1)}.field textarea{height:146px;resize:vertical}.hint,.error{font-size:12px;color:var(--muted);margin-top:7px}.error{color:var(--red);font-weight:600}.delivery-options{display:grid;gap:10px;margin-top:26px}.delivery-option{border:1px solid var(--line);background:var(--cream);padding:17px 18px;cursor:pointer;text-align:left;font:inherit}.delivery-option.selected{border:2px solid var(--red)}.delivery-option b{font:600 18px var(--serif)}.delivery-option span{display:block;color:var(--muted);font-size:13px;margin-top:4px}.note-head{display:flex;justify-content:space-between;gap:12px;align-items:end}.suggestions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.suggestion{border:1px solid var(--line);background:transparent;padding:9px 11px;font:12px var(--sans);cursor:pointer}.summary{background:var(--cream);border:1px solid var(--line);padding:22px;margin:26px 0;max-width:590px}.summary div{display:flex;justify-content:space-between;gap:18px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}.summary div:last-child{border:0}.summary b{font-size:17px}.checkout{max-width:580px}.checkout h3{font:500 27px var(--serif);margin:26px 0 12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.secure{font-size:12px;margin:15px 0;color:var(--muted)}.secure:before{content:'⌁';color:var(--red);font-size:19px;margin-right:6px}.final{padding-top:55px}.final .mark{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:white;font-size:28px;margin-bottom:24px}@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:600px){.stage{padding-top:38px}.packages{grid-template-columns:1fr}.box img{height:180px}.empathy{padding:27px 23px}.two{grid-template-columns:1fr}.top{height:68px}h1{font-size:45px}}
</style><script src="https://js.stripe.com/v3/"></script></head>
<body><div class="shell"><header class="top"><a class="brand" href="/quiz">reconcilia <i>♥</i></a><select class="locale" id="language-switch" aria-label="Language"><option value="en">EN</option><option value="es">ES</option><option value="pt">PT</option></select></header></div><div class="progress"><b id="progress" style="width:0%"></b></div><main class="shell stage" id="app" aria-live="polite"></main>
<script>
const packs={en:1,pt:1,es:1};function detect(){try{const saved=localStorage.getItem('reconcilia-lang');if(saved&&packs[saved])return saved}catch(e){}const langs=navigator.languages||[navigator.language||'en'];return langs.map(x=>x.toLowerCase().slice(0,2)).find(x=>packs[x])||'en'}let lang=detect();document.documentElement.lang=lang==='pt'?'pt-BR':lang;document.getElementById('language-switch').value=lang;document.getElementById('language-switch').addEventListener('change',e=>{localStorage.setItem('reconcilia-lang',e.target.value);lang=e.target.value;document.documentElement.lang=lang==='pt'?'pt-BR':lang;render()});
const state={screen:0,reason:'',feeling:'',box:null,zip:'',delivery:'today',note:''};const boxes=[['The Sweet One',59,'box-sweet-one.jpg','A small gesture that still says a lot.','Teddy bear · Nutella · Ferrero Rocher · Milka · Snickers'],['The Little Gesture',99,'box-little-gesture.jpeg','Flowers, sweets and a softer way back in.','Teddy bear · Fresh flowers · Ferrero Rocher · Milka'],['The Apology',179,'box-apology.jpg','For when “I’m sorry” needs to feel serious.','Teddy bear · Welch’s · Nutella · Pringles · Lindt · Ferrero Rocher'],['The Missing You',229,'box-missing-you.jpg','The grand gesture for a moment that really matters.','Teddy bear · Premium chocolates · Premium nuts · Welch’s · Nutella']];
const reasons=[['fight','We had a fight','I need to make things right.','Sometimes “I’m sorry” needs to arrive as something real.\nYou don’t need another perfect paragraph. You need a gesture that gets there before pride gets in the way.'],['surprise','I want to surprise her','No occasion. Just because.','The best surprises are the ones she wasn’t expecting.\nYou’re already doing the part that matters: choosing to make an ordinary day feel intentional.'],['miss','I miss her','I want her to feel close.','Missing someone deserves more than a heart emoji.\nSend something she can open, feel and keep thinking about after the box is empty.'],['forgot','I forgot an important date','I need to save the moment.','There’s still time to make the moment feel thoughtful.\nA real gesture can turn a forgotten date into the part of the story she remembers.'],['care','I want to show I care','I want her to feel remembered.','Being remembered is its own kind of love.\nNo special occasion required. Sometimes the reason is simply that she matters to you.']];
const feelings=[['happy','I want her to be happy','Then we’ll make the first feeling she has a good one.'],['thinking','I want her to know I’m thinking about her','Then the box should feel personal — not like a last-minute delivery.'],['talk','I want her to talk to me again','Then this needs to feel like an opening, not another demand for an answer.'],['sorry','I want to show I’m truly sorry','Then the gesture needs to do more than say the words. It needs to show you mean them.'],['special','I want to make this moment special','Then every detail should make the moment feel chosen, not ordered.'],['unknown','I don’t know — I just need to do something','That’s enough to start with. We’ll help you turn the feeling into a real gesture.']];
const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const isRepair=()=>['fight'].includes(state.reason)||['sorry','talk'].includes(state.feeling);const selected=a=>a.find(x=>x[0]===state.reason||x[0]===state.feeling);
function nav(label,next=true){return `<div class="continue-row">${state.screen>0?'<button class="back" onclick="go(-1)">← Back</button>':''}<button class="action" onclick="${next?'go(1)':'render()'}">${label}</button></div>`}function go(n){state.screen+=n;render()}function choose(type,value){state[type]=value;const list=type==='reason'?reasons:feelings;const item=list.find(x=>x[0]===value);document.getElementById('reflection').textContent=item[type==='reason'?3:2];document.getElementById('next').disabled=false;document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x.dataset.value===value))}function chooseBox(i){state.box=i;state.screen=4;render()}function pickDelivery(d){state.delivery=d;document.querySelectorAll('.delivery-option').forEach(x=>x.classList.toggle('selected',x.dataset.delivery===d));document.getElementById('delivery-next').textContent=d==='today'?'Yes, prepare it for today':'Reserve this delivery'}function checkZip(){const z=document.getElementById('zip').value.replace(/\D/g,'');const ok=/^(327|328|338|347)/.test(z)&&z.length===5;document.getElementById('zip-error').textContent=ok?'': 'We’re not currently delivering to this ZIP code. Try another nearby ZIP code or choose another delivery date.';if(ok){state.zip=z;state.screen=6;render()}}
function render(){window.scrollTo({top:0,behavior:'smooth'});document.getElementById('progress').style.width=[0,12,25,39,53,65,76,86,94,100,100][state.screen]+'%';let h='';if(state.screen===0)h=`<section class="entry card"><div class="eyebrow">A gesture that arrives before pride</div><h1>What are you trying to say?</h1><p class="lead">Answer a few honest questions and we’ll help you find the right gesture for the moment.</p><button class="action" onclick="go(1)">Find my gesture →</button><div class="proof"><span>No account required</span><span>Delivery included</span><span>Same-day delivery in Orlando</span></div></section>`;
if(state.screen===1)h=question('01','What brings you here today?',reasons,'reason');if(state.screen===2)h=question('02','What do you want her to feel?',feelings,'feeling','The best gift is the one that knows what it’s there to say.');if(state.screen===3)h=`<section class="card"><div class="step"><span>03</span> / 08</div><h2>How big should the gesture feel?</h2><p>Be honest: is this a small gesture or a “wow, he really means it” moment?</p><div class="choices packages">${boxes.map((b,i)=>`<button class="box" onclick="chooseBox(${i})">${i===2?'<span class="tag">MOST CHOSEN FOR APOLOGIES</span>':''}<img src="/images/${b[2]}" alt="${b[0]} gift box"><div class="box-copy"><span class="price">$${b[1]}</span><h3>${b[0]}</h3><p>${b[3]}</p><ul><li>${b[4]}</li><li>Personalized note</li></ul></div></button>`).join('')}</div><button class="back" onclick="go(-1)">← Back</button></section>`;
if(state.screen===4){const repair=isRepair();h=`<section class="card empathy"><div class="eyebrow">A little extra care</div><h2>${repair?'We understand.':'That’s a beautiful reason to send a gift.'}</h2><p>${repair?'When things get complicated, it’s hard to know what to say — or how to start fixing it. You deserve a little help making this moment feel right.':'The fact that you’re taking the time to do this already says a lot.'}</p><div class="gift"><b>${repair?'Your personalized letter is on us.':'We’ll include a personalized letter at no extra cost.'}</b><span>Write it in your own words. We’ll print it on real gift paper and place it inside the box for her to find first.${repair?' Included at no extra cost.':''}</span></div><button class="action" onclick="go(1)">Check delivery for her →</button></section>`}if(state.screen===5)h=`<section class="card"><div class="step"><span>04</span> / 08</div><h2>Where is she located?</h2><p>Let’s see the fastest delivery window for her area. You won’t be charged yet.</p><div class="form"><div class="field"><label>Her ZIP code</label><input id="zip" inputmode="numeric" maxlength="5" placeholder="32801" value="${state.zip}"></div><p class="hint">No account or payment required to check.</p><p class="error" id="zip-error"></p><button class="action" onclick="checkZip()">Check delivery →</button></div><button class="back" onclick="go(-1)">← Back</button></section>`;
if(state.screen===6)h=`<section class="card"><div class="step"><span>05</span> / 08</div><div class="eyebrow">Good news — we can deliver to ${state.zip}.</div><h2>The fastest we can get there is today.</h2><p>Does that work for you, or should we prepare it for another date?</p><div class="delivery-options"><button class="delivery-option ${state.delivery==='today'?'selected':''}" data-delivery="today" onclick="pickDelivery('today')"><b>Today · 5:00–8:00 PM</b><span>Orlando local time · delivery included</span></button><button class="delivery-option" data-delivery="tomorrow" onclick="pickDelivery('tomorrow')"><b>Tomorrow · 10:00 AM–1:00 PM</b><span>Delivery included</span></button><button class="delivery-option" data-delivery="date" onclick="pickDelivery('date')"><b>Another date</b><span>Choose a different date at checkout</span></button></div><p class="hint">Orders confirmed by 2 PM go into the same-day route when available.</p><div class="continue-row"><button class="back" onclick="go(-1)">← Back</button><button id="delivery-next" class="action" onclick="go(1)">Yes, prepare it for today</button></div></section>`;
if(state.screen===7){let ph=isRepair()?'I know I hurt you. I’m sorry. I care about you and I want to make things right…':'No special occasion. I just wanted to remind you how special you are…';h=`<section class="card"><div class="step"><span>06</span> / 08</div><h2>Now write what you really mean.</h2><p>The box gets her attention. <b>Your words are what she’ll remember.</b></p><div class="form"><div class="note-head"><label class="eyebrow" style="margin:18px 0 7px">Your personal note</label><span class="hint" id="count">${state.note.length}/180</span></div><textarea id="note" maxlength="180" placeholder="${ph}" oninput="state.note=this.value;document.getElementById('count').textContent=this.value.length+'/180'">${esc(state.note)}</textarea><p class="hint">Printed on real gift paper</p><div class="suggestions"><button class="suggestion" onclick="setNote('I know I hurt you. I’m sorry. I don’t expect this to fix everything, but I want you to know that I care.')">Use apology suggestion</button><button class="suggestion" onclick="setNote('No special occasion. I just wanted to make you smile and remind you how special you are.')">Use a suggestion</button></div><div class="continue-row"><button class="back" onclick="go(-1)">← Back</button><button class="action" onclick="continueNote()">Continue to my gift →</button></div></div></section>`}if(state.screen===8){const b=boxes[state.box];const when=state.delivery==='today'?'Today · 5:00–8:00 PM':state.delivery==='tomorrow'?'Tomorrow · 10:00 AM–1:00 PM':'Your selected date';const cta=state.reason==='fight'?`Send my apology ${state.delivery==='today'?'today':''} — $${b[1]}`:state.reason==='miss'?`Send her a reminder that I care — $${b[1]}`:state.reason==='forgot'?`Save the moment — $${b[1]}`:`Make her smile ${state.delivery==='today'?'today':''} — $${b[1]}`;h=`<section class="card"><div class="step"><span>07</span> / 08</div><h2>Send her something real.</h2><div class="summary"><div><span>Gift box</span><b>${b[0]}</b></div><div><span>Personalized letter</span><b>Included</b></div><div><span>Delivery</span><b>${when}</b></div><div><span>Delivery fee</span><b>Included</b></div><div><span>Total</span><b>$${b[1]}</b></div></div><p>Everything is ready. The only thing missing is your note.</p><div class="continue-row"><button class="back" onclick="go(-1)">← Back</button><button class="action" onclick="go(1)">${cta}</button></div></section>`}if(state.screen===9)h=checkout();if(state.screen===10){const b=boxes[state.box];h=`<section class="card final"><div class="mark">✓</div><div class="eyebrow">Order confirmed</div><h1>Your gesture is on its way.</h1><p>We’re preparing ${b[0]} with your words inside. She’ll receive it ${state.delivery==='today'?'today, between 5:00–8:00 PM.':'on your selected delivery date.'}</p><div class="summary"><div><span>Gift</span><b>${b[0]}</b></div><div><span>Letter</span><b>Personalized · included</b></div><div><span>Delivery</span><b>${state.delivery==='today'?'Today · 5:00–8:00 PM':'Scheduled'}</b></div></div><p><i>Sometimes the smallest decision is the beginning of the conversation.</i></p></section>`}app.innerHTML=h}
function question(no,title,items,type,sub=''){return `<section class="card"><div class="step"><span>${no}</span> / 08</div><h2>${title}</h2>${sub?`<p>${sub}</p>`:''}<div class="choices">${items.map(x=>`<button class="choice ${state[type]===x[0]?'selected':''}" data-value="${x[0]}" onclick="choose('${type}','${x[0]}')"><strong>${x[1]}</strong>${x[2]&&type==='reason'?`<small>${x[2]}</small>`:''}</button>`).join('')}</div><div class="reflection" id="reflection">${state[type]?(items.find(x=>x[0]===state[type])[type==='reason'?3:2]):'Choose the answer that feels most honest.'}</div><div class="continue-row">${state.screen>1?'<button class="back" onclick="go(-1)">← Back</button>':''}<button class="action" id="next" ${state[type]?'':'disabled'} onclick="go(1)">Continue →</button></div></section>`}function setNote(n){state.note=n;document.getElementById('note').value=n;document.getElementById('count').textContent=n.length+'/180'}function continueNote(){state.note=document.getElementById('note').value.trim();if(!state.note){document.getElementById('note').focus();return}go(1)}function checkout(){const b=boxes[state.box],day=state.delivery==='today'?'today':'tomorrow';return `<section class="card checkout"><div class="step"><span>08</span> / 08</div><h2>Almost there.</h2><p>Enter delivery details and payment to send your gesture.</p><h3>Delivery details</h3><div class="two"><div class="field"><label>Her name</label><input id="recipientName" required></div><div class="field"><label>Your name</label><input id="senderName" required></div></div><div class="field"><label>Her delivery address</label><input id="address" required></div><div class="two"><div class="field"><label>City</label><input id="city" value="Orlando"></div><div class="field"><label>State</label><input id="state" value="FL"></div></div><h3>Your email for delivery updates</h3><div class="field"><input id="email" type="email" placeholder="you@example.com" required></div><h3>Card details</h3><div id="payment-element" class="field"><p class="hint">Your secure payment form will load after delivery details are confirmed.</p></div><p class="secure">Your payment is encrypted. You’ll receive a text update when it’s on the way.</p><p class="error" id="payment-error"></p><div class="continue-row"><button class="back" onclick="go(-1)">← Back</button><button class="action" id="pay-button" onclick="submitOrder()">Continue to secure payment — $${b[1]}</button></div></section>`}let stripeClient,stripeElements,orderId,orderToken;async function submitOrder(){const err=document.getElementById('payment-error'),button=document.getElementById('pay-button');err.textContent='';if(stripeElements){button.disabled=true;const result=await stripeClient.confirmPayment({elements:stripeElements,confirmParams:{return_url:location.origin+'/success'},redirect:'if_required'});button.disabled=false;if(result.error){err.textContent=result.error.message;return}state.screen=10;render();return}const ids=['recipientName','senderName','address','email'];const missing=ids.find(id=>!document.getElementById(id).value.trim());if(missing){document.getElementById(missing).focus();err.textContent='Please complete the required delivery details.';return}button.disabled=true;button.textContent='Preparing secure payment…';try{const order=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({packageName:boxes[state.box][0],note:state.note,recipientName:document.getElementById('recipientName').value,recipientAddress:document.getElementById('address').value,recipientCity:document.getElementById('city').value,recipientState:document.getElementById('state').value,recipientZip:state.zip,deliveryDate:state.delivery,deliveryWindow:state.delivery==='today'?'5:00–8:00 PM':'10:00 AM–1:00 PM',senderName:document.getElementById('senderName').value,senderEmail:document.getElementById('email').value})});const orderData=await order.json();if(!order.ok)throw new Error(orderData.error||'Could not save your order.');orderId=orderData.orderId;orderToken=orderData.orderToken;const config=await (await fetch('/api/config')).json();if(!config.publishableKey||!window.Stripe)throw new Error('Secure payment is not configured yet. Please try again later.');const intent=await fetch('/api/create-payment-intent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({orderId,orderToken})});const intentData=await intent.json();if(!intent.ok)throw new Error(intentData.error||'Could not start payment.');stripeClient=Stripe(config.publishableKey);stripeElements=stripeClient.elements({clientSecret:intentData.clientSecret,appearance:{theme:'stripe',variables:{colorPrimary:'#b93632',colorBackground:'#fffaf2',colorText:'#17120f',fontFamily:'DM Sans, Arial, sans-serif'}}});stripeElements.create('payment').mount('#payment-element');button.disabled=false;button.textContent='Send my gift '+(state.delivery==='today'?'today':'tomorrow')+' — $'+boxes[state.box][1]}catch(e){err.textContent=e.message||'Something went wrong. Please try again.';button.disabled=false;button.textContent='Continue to secure payment — $'+boxes[state.box][1]}}render();
</script></body></html>
