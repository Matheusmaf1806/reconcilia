<script>
  const icons = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
  const supported = { en: 1, es: 1, pt: 1 };
  function detectLanguage() { try { const saved = localStorage.getItem('reconcilia-lang'); if (saved && supported[saved]) return saved; } catch (_) {} const languages = navigator.languages || [navigator.language || 'en']; return languages.map(value => value.toLowerCase().slice(0, 2)).find(value => supported[value]) || 'en'; }
  let language = detectLanguage(); document.documentElement.lang = language === 'pt' ? 'pt-BR' : language;
  const switcher = document.getElementById('language-switch'); switcher.value = language; switcher.addEventListener('change', event => { language = event.target.value; localStorage.setItem('reconcilia-lang', language); document.documentElement.lang = language === 'pt' ? 'pt-BR' : language; });
  const state = { step: 1, recipient: '', reason: '', feeling: '', box: null, zip: '', delivery: null, selectedDate: '', note: '' };
  const recipients = [['her', 'I’m sending it to her', 'heart'], ['him', 'I’m sending it to him', 'heart'], ['private', 'I’d rather not say', 'lock']];
  const reasons = [['fight', 'We had a fight', 'I need to make things right.', 'chat'], ['surprise', 'I want to surprise them', 'No occasion. Just because.', 'spark'], ['miss', 'I miss them', 'I want them to feel close.', 'heart'], ['forgot', 'I forgot an important date', 'I need to save the moment.', 'calendar'], ['care', 'I want to show I care', 'I want them to feel remembered.', 'gift']];
  const feelings = [['happy', 'I want them to be happy', 'spark'], ['thinking', 'I want them to know I’m thinking about them', 'heart'], ['talk', 'I want them to talk to me again', 'chat'], ['sorry', 'I want to show I’m truly sorry', 'heart'], ['special', 'I want to make this moment special', 'gift'], ['unknown', 'I don’t know, I just need to do something', 'spark']];
  const boxes = [['The Sweet One',59,'box-sweet-one.jpg','A small gesture that still says a lot.','Teddy bear, Nutella, Ferrero Rocher, Milka and Snickers'],['The Little Gesture',99,'box-little-gesture.jpeg','Flowers, sweets and a softer way back in.','Teddy bear, fresh flowers, Ferrero Rocher and Milka'],['The Apology',179,'box-apology.jpg','For when “I’m sorry” needs to feel serious.','Teddy bear, Welch’s, Nutella, Pringles, Lindt and Ferrero Rocher'],['The Missing You',229,'box-missing-you.jpg','The grand gesture for a moment that really matters.','Teddy bear, premium chocolates, nuts, Welch’s and Nutella']];
  const app = document.getElementById('app'); let stripeClient; let stripeElements; let orderId; let orderToken;
  const TRACKING_KEY = 'reconcilia-quiz-session';
  const DRAFT_KEY = 'reconcilia-quiz-draft';
  let trackingId = sessionStorage.getItem(TRACKING_KEY);
  if (!trackingId) { trackingId = (typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`).slice(0, 100); sessionStorage.setItem(TRACKING_KEY, trackingId); }
  function trackQuiz(step) { const payload = { sessionId: trackingId, furthestStep: Math.min(6, Math.max(0, step - 1)), packageName: state.box === null ? null : boxes[state.box][0], zipChecked: state.zip || null, secondsOnPage: Math.round(performance.now() / 1000) }; fetch('/api/track', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload), keepalive: true }).catch(() => {}); }
  function saveDraft() { const { recipient, reason, feeling, box, zip, delivery, selectedDate } = state; sessionStorage.setItem(DRAFT_KEY, JSON.stringify({ recipient, reason, feeling, box, zip, delivery, selectedDate })); }
  function restoreDraft() { try { const draft = JSON.parse(sessionStorage.getItem(DRAFT_KEY) || 'null'); if (draft && typeof draft === 'object') Object.assign(state, draft); } catch (_) {} }
  restoreDraft();
  const repair = () => state.reason === 'fight' || ['sorry', 'talk'].includes(state.feeling);
  const escapeHtml = value => String(value).replace(/[&<>"']/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[character]));
  function setStep(step) { state.step = step; saveDraft(); trackQuiz(step); render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function selectRecipient(value) { state.recipient = value; setStep(2); }
  function selectAnswer(type, value) { state[type] = value; setStep(type === 'reason' ? 3 : 4); }
  function selectBox(index) { state.box = index; setStep(5); }
  function checkZip() { const zip = document.getElementById('zip').value.replace(/\D/g, ''); const valid = /^(327|328|338|347)/.test(zip) && zip.length === 5; document.getElementById('zip-error').textContent = valid ? '' : 'We’re not currently delivering to this ZIP code. Try another nearby ZIP code.'; if (valid) { state.zip = zip; setStep(6); } }
  function etNow() { const format = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour12: false, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' }); const data = Object.fromEntries(format.formatToParts(new Date()).filter(part => part.type !== 'literal').map(part => [part.type, part.value])); return { minutes: Number(data.hour) * 60 + Number(data.minute), iso: `${data.year}-${data.month}-${data.day}` }; }
  function addDays(iso, days) { const value = new Date(`${iso}T12:00:00Z`); value.setUTCDate(value.getUTCDate() + days); return value.toISOString().slice(0,10); }

  function deliverySlots(date = '') { const now = etNow(); const selected = date || now.iso; const daysAway = Math.round((new Date(`${selected}T12:00:00Z`) - new Date(`${now.iso}T12:00:00Z`)) / 86400000); const windows = [[8,'8:00 AM to 11:00 AM'],[11,'11:00 AM to 2:00 PM'],[14,'2:00 PM to 5:00 PM'],[17,'5:00 PM to 8:00 PM'],[20,'8:00 PM to 11:00 PM']]; let available = windows; if (daysAway === 0) available = windows.filter(([hour]) => hour * 60 >= now.minutes + 300); if (!available.length) return deliverySlots(addDays(now.iso, 1)); const day = daysAway === 0 ? 'Today' : daysAway === 1 ? 'Tomorrow' : prettyDate(selected); return available.map(([hour, label], index) => ({ day, date: selected, label, spots: daysAway === 0 ? Math.min(3, 1 + index) : daysAway === 1 ? 4 + (index % 2) : 'Open' })); }

  function toggleCalendar() { const box = document.getElementById('calendar-box'); box.hidden = !box.hidden; if (!box.hidden) document.getElementById('delivery-date').focus(); }
  function selectDate() { const date = document.getElementById('delivery-date').value; if (!date) return; state.selectedDate = date; state.delivery = null; renderDeliveryInPlace(); }

  function showFinish() { if (state.delivery) setStep(7); }
  function useSuggestion(value) { state.note = value; const note = document.getElementById('note'); note.value = value; updateCount(); }
  function updateCount() { const note = document.getElementById('note'); state.note = note.value; document.getElementById('count').textContent = `${note.value.length}/180`; }
  function renderQuestion(number, title, subtitle, items, kind) { const handler = kind === 'recipient' ? 'selectRecipient' : `selectAnswer('${kind}'`; return `<section class="card"><div class="step"><b>${number}</b> / 07</div><h1>${title}</h1>${subtitle ? `<p class="sub">${subtitle}</p>` : ''}<div class="choices">${items.map(item => `<button class="choice" onclick="${kind === 'recipient' ? `${handler}('${item[0]}')` : `${handler},'${item[0]}')`}"><span class="choice-icon">${icons(item[item.length - 1])}</span><span><strong>${item[1]}</strong>${kind === 'reason' ? `<small>${item[2]}</small>` : ''}</span><span class="go-icon">${icons('arrow')}</span></button>`).join('')}</div></section>`; }
  function deliveryContent() { const slots = visibleSlots(); const fastest = slots[0]; const laterSlots = slots.slice(1); const showingDate = Boolean(state.selectedDate); const title = showingDate ? `Delivery on ${fastest.day}` : `${fastest.day} delivery is available.`; const min = earliestDeliveryDate(); const slotMarkup = (slot, index) => `<button class="slot" aria-pressed="${state.delivery && state.delivery.label === slot.label && state.delivery.date === slot.date}" onclick="chooseDelivery(${index})"><b>${slot.label}</b><span>${icons('truck')} Orlando local time · delivery included</span><span class="availability">${slot.spots === 'Open' ? 'Open delivery spots' : `${slot.spots} ${slot.spots === 1 ? 'spot' : 'spots'} remaining`}</span></button>`; return `<div class="delivery-card"><div class="delivery-kicker">${icons('pin')} Delivery available for ZIP ${state.zip}</div><h1>${title}</h1><p class="sub">We only show windows with enough time to prepare a gift properly.</p><div class="delivery-fast"><span class="eyebrow" style="color:var(--yellow);margin:0">Fastest available</span><b>${fastest.day} · ${fastest.label}</b><p>Your gift is hand-prepared locally, then delivered to their door.</p><span class="availability">${fastest.spots === 'Open' ? 'Open delivery spots' : `${fastest.spots} ${fastest.spots === 1 ? 'spot' : 'spots'} remaining`}</span></div><button class="btn" onclick="chooseDelivery(0);showFinish()">Choose fastest delivery ${icons('arrow')}</button><hr class="delivery-divider"><h2 class="delivery-heading">Want another time?</h2><p class="sub">Choose another available window, or select a different delivery date.</p><div class="schedule">${laterSlots.map((slot, index) => slotMarkup(slot, index + 1)).join('') || '<p style="font-size:13px">No later window is available today.</p>'}</div><button class="suggestion" onclick="toggleCalendar()">${icons('calendar')} Choose another date</button><div class="calendar-box" id="calendar-box" hidden><div class="field"><label>Choose delivery date</label><input id="delivery-date" type="date" min="${min}" value="${state.selectedDate}" onchange="selectDate()"></div></div><div class="delivery-actions"><button class="back" onclick="setStep(5)">Back</button><button class="btn" id="delivery-continue" onclick="showFinish()" ${state.delivery ? '' : 'disabled'}>Continue with selected delivery ${icons('arrow')}</button></div></div>`; }
  function renderDelivery() { return `<section class="card"><div class="step"><b>06</b> / 07</div><div id="delivery-content">${deliveryContent()}</div></section>`; }
  function summaryRows() { const box = boxes[state.box]; const delivery = state.delivery ? `${state.delivery.day}, ${state.delivery.label}` : 'Choose delivery'; return `<div class="summary-row"><span>Gift box</span><b>${box[0]}</b></div><div class="summary-row"><span>Personalized letter</span><b><span class="old">$10</span><span class="included">Included</span></b></div><div class="summary-row"><span>Local delivery</span><b><span class="old">$19</span><span class="included">Included</span></b></div><div class="summary-row"><span>Delivery window</span><b>${delivery}</b></div><div class="summary-row total"><span>Total</span><b>$${box[1]}</b></div>`; }
  function renderFinish() { const placeholder = repair() ? 'I know I hurt you. I’m sorry. I care about you and I want to make things right…' : 'No special occasion. I just wanted to remind you how special you are…'; return `<section class="finish"><div class="step"><b>07</b> / 07</div><h1>Now write what you really mean.</h1><p class="sub">The box gets their attention. Your words are what they’ll remember.</p><div class="finish-grid"><div><div class="letter-panel"><div class="letter-title">${icons('note')} Their personalized letter</div><div class="letter"><textarea id="note" maxlength="180" placeholder="${placeholder}" oninput="updateCount()">${escapeHtml(state.note)}</textarea><span class="count" id="count">${state.note.length}/180</span></div></div><div class="suggestions"><button class="suggestion" onclick="useSuggestion('I know I hurt you. I’m sorry. I don’t expect this to fix everything, but I want you to know that I care.')">Use apology suggestion</button><button class="suggestion" onclick="useSuggestion('No special occasion. I just wanted to make you smile and remind you how special you are.')">Use surprise suggestion</button></div></div><aside class="checkout-card"><h3>Send something real.</h3>${summaryRows()}<div class="situation">${icons('heart')}<span><b>Two extras are a gift from us.</b><br>Because this is an important moment, the $19 local delivery and $10 personalized letter are included today.</span></div><div class="trust-stack"><div class="trust-item">${icons('gift')} Hand-packed in Orlando</div><div class="trust-item">${icons('truck')} Delivery updates included</div><div class="trust-item">${icons('lock')} Secure Stripe payment</div></div><div class="social-proof">“She sent me a photo before opening it. That started the conversation.”<b>RAFAEL · ORLANDO</b></div><div class="payment"><div class="recipient-fields"><h4>${icons('pin')} Recipient delivery details</h4><p>These details tell us exactly where their gift should go.</p><div class="field"><label>Recipient name</label><input id="recipientName" autocomplete="shipping name"></div><div class="field"><label>Delivery address</label><input id="address" autocomplete="shipping street-address"></div><div class="two"><div class="field"><label>City</label><input id="city" value="Orlando" autocomplete="shipping address-level2"></div><div class="field"><label>State</label><input id="region" value="FL" autocomplete="shipping address-level1"></div></div></div><h4>Your details</h4><div class="field"><label>Your name</label><input id="senderName" autocomplete="name"></div><div class="field"><label>Your email for updates</label><input id="email" type="email" autocomplete="email" placeholder="you@example.com"></div><h4>Secure payment</h4><div id="payment-element" class="field"><p style="font-size:12px">Confirm your delivery details to load the secure card form.</p></div><p class="secure">${icons('lock')} Your payment is encrypted and processed securely by Stripe.</p><p id="payment-error" class="error"></p><button class="btn pay-button" id="pay-button" onclick="submitPayment()">Continue to secure payment ${icons('arrow')}</button></div></aside></div><button class="back" onclick="setStep(6)">Back</button></section>`; }
  async function submitPayment() { const error = document.getElementById('payment-error'); const button = document.getElementById('pay-button'); error.textContent = ''; if (!state.note.trim()) { error.textContent = 'Write your note before continuing.'; document.getElementById('note').focus(); return; } if (stripeElements) { button.disabled = true; const result = await stripeClient.confirmPayment({ elements: stripeElements, confirmParams: { return_url: location.origin + '/success' }, redirect: 'if_required' }); button.disabled = false; if (result.error) { error.textContent = result.error.message; return; } sessionStorage.removeItem(DRAFT_KEY); setStep(8); return; } const required = ['recipientName', 'senderName', 'address', 'email']; const missing = required.find(id => !document.getElementById(id).value.trim()); if (missing) { document.getElementById(missing).focus(); error.textContent = 'Please complete the delivery details.'; return; } button.disabled = true; button.textContent = 'Preparing secure payment…'; try { const orderResponse = await fetch('/api/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ packageName: boxes[state.box][0], note: state.note.trim(), recipientName: document.getElementById('recipientName').value, recipientAddress: document.getElementById('address').value, recipientCity: document.getElementById('city').value, recipientState: document.getElementById('region').value, recipientZip: state.zip, deliveryDate: state.delivery.date, deliveryWindow: state.delivery.label, senderName: document.getElementById('senderName').value, senderEmail: document.getElementById('email').value }) }); const order = await orderResponse.json(); if (!orderResponse.ok) throw new Error(order.error || 'Could not save your order.'); orderId = order.orderId; orderToken = order.orderToken; const config = await (await fetch('/api/config')).json(); if (!config.publishableKey || !window.Stripe) throw new Error('Secure payment is not configured yet. Please try again later.'); const intentResponse = await fetch('/api/create-payment-intent', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ orderId, orderToken }) }); const intent = await intentResponse.json(); if (!intentResponse.ok) throw new Error(intent.error || 'Could not start payment.'); stripeClient = Stripe(config.publishableKey); stripeElements = stripeClient.elements({ clientSecret: intent.clientSecret, appearance: { theme: 'stripe', variables: { colorPrimary: '#b93632', colorBackground: '#fffdf9', colorText: '#17120f', fontFamily: 'DM Sans, Arial, sans-serif' } } }); stripeElements.create('payment').mount('#payment-element'); button.disabled = false; button.textContent = `Send my gift ${state.delivery.day.toLowerCase()} · $${boxes[state.box][1]}`; } catch (exception) { error.textContent = exception.message || 'Something went wrong. Please try again.'; button.disabled = false; button.textContent = 'Continue to secure payment'; } }
  function render() { document.getElementById('progress').style.width = ({1:12,2:25,3:38,4:51,5:64,6:78,7:92,8:100}[state.step] || 0) + '%'; if (state.step === 1) app.innerHTML = renderQuestion('01', 'Who are you sending this to?', 'This simply helps us make the next questions feel more personal.', recipients, 'recipient'); if (state.step === 2) app.innerHTML = renderQuestion('02', 'What brings you here today?', '', reasons, 'reason'); if (state.step === 3) app.innerHTML = renderQuestion('03', 'What do you want them to feel?', 'The best gift is the one that knows what it’s there to say.', feelings, 'feeling'); if (state.step === 4) app.innerHTML = `<section class="card"><div class="step"><b>04</b> / 07</div><h1>How big should the gesture feel?</h1><p class="sub">Be honest: is this a small gesture or a “wow, they really mean it” moment?</p><div class="choices packages">${boxes.map((box, index) => `<button class="box" onclick="selectBox(${index})">${index === 2 ? '<span class="tag">MOST CHOSEN FOR APOLOGIES</span>' : ''}<img src="/images/${box[2]}" alt="${box[0]} gift box"><div class="box-copy"><span class="price">$${box[1]}</span><h3>${box[0]}</h3><p>${box[3]}</p><ul><li>${box[4]}</li><li>Personalized letter included</li></ul></div></button>`).join('')}</div><button class="back" onclick="setStep(3)">Back</button></section>`; if (state.step === 5) { const copy = repair() ? ['We’re adding two meaningful extras for free.', 'A difficult moment should not have to feel like a transaction.'] : ['We’re adding two meaningful extras for free.', 'Taking the time to send this already says a lot.']; app.innerHTML = `<section class="card empathy"><div class="eyebrow">A gift for this moment</div><h2>${copy[0]}</h2><p>${copy[1]}</p><div class="price-reveal"><h3>Your moment, priced honestly.</h3><div class="price-reveal-row"><span>${boxes[state.box][0]}</span><b>$${boxes[state.box][1]}</b></div><div class="price-reveal-row"><span>Orlando local delivery</span><b class="old">$19</b></div><div class="price-reveal-row"><span>Personalized letter on real gift paper</span><b class="old">$10</b></div><div class="price-reveal-row price-reveal-total"><span>You pay today</span><b>$${boxes[state.box][1]}</b></div></div><div class="gift-banner">${icons('gift')}<div><b>$29 in extras included today</b><span>We removed the delivery and letter costs because this is an important moment. No code and no added cost at checkout.</span></div></div><div class="offer">${icons('note')}<div><b>Personalized letter is a gift</b><span>Printed on real gift paper and placed inside the box for them to find first.</span></div></div><div class="offer">${icons('truck')}<div><b>Local delivery is a gift</b><span>Prepared and delivered locally for their selected time window.</span></div></div><button class="btn" onclick="setStep(6)">${icons('pin')} Check delivery for them</button></section>`; } if (state.step === 6) app.innerHTML = renderDelivery(); if (state.step === 7) app.innerHTML = renderFinish(); if (state.step === 8) { const box = boxes[state.box]; app.innerHTML = `<section class="card done"><div class="done-mark">${icons('check')}</div><div class="eyebrow">Order confirmed</div><h1>Your gesture is on its way.</h1><p class="sub">We’re preparing ${box[0]} with your words inside. They’ll receive it ${state.delivery.day.toLowerCase()}, between ${state.delivery.label}.</p><div class="summary">${summaryRows()}</div><p><i>Sometimes the smallest decision is the beginning of the conversation.</i></p></section>`; } }
  render();
  trackQuiz(state.step);
</script>
