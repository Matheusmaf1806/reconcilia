    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)} button,input,textarea{font:inherit} button{cursor:pointer}.shell{width:min(1000px,calc(100% - 32px));margin:auto}.top{height:72px;display:flex;align-items:center;justify-content:space-between}.brand{font:600 26px var(--serif);letter-spacing:-.05em;color:inherit;text-decoration:none}.brand i{color:var(--red);font-style:normal}.locale{border:0;background:transparent;color:var(--muted);font:12px var(--mono);letter-spacing:.1em}.progress{height:4px;background:#e2d7c9}.progress b{display:block;height:100%;background:var(--red);transition:width .3s ease}.stage{padding:48px 0 80px}.card{max-width:760px;margin:auto;animation:in .28s ease}.step{font:11px var(--mono);color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:18px}.step b{color:var(--red)}.eyebrow{font:11px var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--red);margin-bottom:15px}h1,h2{font:500 clamp(40px,6vw,64px)/.98 var(--serif);letter-spacing:-.065em;margin:0 0 17px}h2{font-size:clamp(33px,4.7vw,50px)}p{font-size:16px;line-height:1.6;color:var(--muted);margin:0}.sub{max-width:570px}.choices{display:grid;gap:11px;margin-top:30px}.choice{display:grid;grid-template-columns:48px 1fr 20px;gap:16px;align-items:center;width:100%;border:1px solid var(--line);background:var(--white);padding:17px 19px;text-align:left;color:var(--ink);transition:.18s}.choice:hover{border-color:var(--red);transform:translateY(-2px);box-shadow:5px 6px 0 rgba(185,54,50,.11)}.choice strong{display:block;font:600 20px var(--serif);letter-spacing:-.02em}.choice small{display:block;font-size:13px;color:var(--muted);margin-top:4px}.icon{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.choice-icon{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#f1e6d6;color:var(--red)}.go-icon{color:var(--red)}.back{border:0;background:none;color:var(--muted);font-size:13px;padding:17px 0}.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid var(--ink);border-radius:2px;background:var(--ink);color:var(--paper);font-weight:700;font-size:14px;padding:16px 22px;transition:.18s}.btn:hover{background:var(--red);border-color:var(--red);transform:translateY(-2px)}.btn .icon{width:17px;height:17px}.intro-proof{display:flex;flex-wrap:wrap;gap:10px 22px;margin-top:26px;color:var(--muted);font-size:12px}.intro-proof span{display:flex;gap:6px;align-items:center}.intro-proof .icon{width:15px;color:var(--green)}.packages{grid-template-columns:repeat(2,1fr);gap:17px}.box{padding:0;border:1px solid var(--line);background:var(--white);text-align:left;overflow:hidden;position:relative;transition:.18s}.box:hover{border-color:var(--red);box-shadow:6px 7px 0 rgba(185,54,50,.12);transform:translateY(-3px)}.box img{width:100%;height:175px;object-fit:cover;display:block}.box-copy{padding:17px}.box h3{font:600 22px var(--serif);letter-spacing:-.03em;margin:0}.price{float:right;color:var(--red);font:600 22px var(--serif)}.box p{font-size:13px;line-height:1.45;margin:10px 0}.box ul{margin:0;padding:0;list-style:none;font-size:11px;color:var(--muted);line-height:1.7}.tag{position:absolute;top:12px;left:12px;background:var(--red);color:#fff;padding:6px 8px;font:10px var(--mono);letter-spacing:.03em}.empathy{max-width:700px;background:var(--ink);padding:42px;color:var(--paper)}.empathy h2{font-size:43px}.empathy p{color:#d8cabb}.offer{margin:27px 0;padding:21px 0;border-top:1px solid rgba(255,255,255,.2);border-bottom:1px solid rgba(255,255,255,.2);display:grid;grid-template-columns:42px 1fr;gap:14px}.offer .icon{color:var(--yellow);width:30px;height:30px}.offer b{display:block;color:var(--yellow);font:500 26px var(--serif)}.offer span{display:block;margin-top:5px;color:#d8cabb;font-size:13px;line-height:1.55}.empathy .btn{background:var(--yellow);border-color:var(--yellow);color:var(--ink);width:100%;min-height:58px;font-size:16px}.empathy .btn:hover{background:#f4cc6c}.field{margin:15px 0}.field label{display:block;margin-bottom:7px;color:var(--muted);font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase}.field input,.field textarea{width:100%;background:var(--white);border:1px solid var(--line);border-radius:2px;padding:14px;color:var(--ink);outline:0}.field input:focus,.field textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(185,54,50,.1)}.error{color:var(--red);font-size:12px;margin:10px 0}.schedule{display:grid;gap:10px;margin:27px 0}.slot{width:100%;padding:17px 18px;background:var(--white);border:1px solid var(--line);text-align:left}.slot.selected{border:2px solid var(--red)}.slot b{font:600 19px var(--serif)}.slot span{display:block;margin-top:4px;font-size:13px;color:var(--muted)}.finish{max-width:980px}.finish-grid{display:grid;grid-template-columns:1.08fr .92fr;gap:27px;align-items:start}.letter-panel{background:#eee2d1;padding:18px;position:relative}.letter-panel:before{content:'';position:absolute;inset:7px;border:1px solid rgba(185,54,50,.2);pointer-events:none}.letter-title{position:relative;display:flex;align-items:center;gap:9px;color:var(--red);font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;margin:5px 4px 13px}.letter-title .icon{width:18px}.letter{position:relative;background:#fffdf8;padding:28px;min-height:330px;box-shadow:0 8px 20px rgba(64,39,26,.12);transform:rotate(-.6deg)}.letter:after{content:'reconcilia';position:absolute;right:22px;bottom:16px;color:#ceb9a4;font:italic 18px var(--serif)}.letter textarea{width:100%;height:205px;resize:vertical;background:transparent;border:0;outline:0;color:#44362e;font:italic 22px/1.45 var(--serif)}.letter textarea::placeholder{color:#a89788}.count{color:var(--muted);font:11px var(--mono)}.suggestions{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.suggestion{border:1px solid rgba(23,18,15,.19);background:transparent;padding:8px 10px;font-size:12px}.checkout-card{background:var(--white);border:1px solid var(--line);padding:23px}.checkout-card h3{font:500 29px var(--serif);margin:0 0 16px}.summary-row{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px}.summary-row b{font-weight:600;text-align:right}.included{color:var(--green)}.old{color:var(--muted);text-decoration:line-through;margin-right:6px;font-weight:400}.situation{display:flex;gap:10px;background:#f2e6d5;color:#5c493a;padding:12px;margin:15px 0;font-size:12px;line-height:1.45}.situation .icon{color:var(--red);flex:none;width:19px}.total{font-size:17px}.payment{margin-top:19px}.payment h4{font:500 21px var(--serif);margin:0 0 10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.secure{display:flex;gap:8px;color:var(--muted);font-size:12px;line-height:1.4;margin:13px 0}.secure .icon{width:17px;color:var(--green);flex:none}.pay-button{width:100%;margin-top:5px}.done{padding-top:60px}.done-mark{width:55px;height:55px;border-radius:50%;display:grid;place-items:center;background:var(--red);color:#fff;margin-bottom:22px}.done-mark .icon{width:27px}.summary{max-width:580px;background:var(--white);border:1px solid var(--line);padding:20px;margin:25px 0}@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@media(max-width:720px){.stage{padding-top:32px}.packages,.finish-grid{grid-template-columns:1fr}.box img{height:190px}.empathy{padding:28px 23px}.empathy h2{font-size:37px}.letter{min-height:290px}.two{grid-template-columns:1fr}}

<body>
  <svg width="0" height="0" style="position:absolute"><defs>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol><symbol id="i-heart" viewBox="0 0 24 24"><path d="M20.8 4.8a5.5 5.5 0 0 0-7.8 0L12 6l-1.1-1.2a5.5 5.5 0 0 0-7.8 7.8L12 21l8.9-8.4a5.5 5.5 0 0 0-.1-7.8Z"/></symbol><symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 2 1.7 7.7L21 12l-7.3 2.3L12 22l-1.7-7.7L3 12l7.3-2.3L12 2Z"/></symbol><symbol id="i-chat" viewBox="0 0 24 24"><path d="M20 15a4 4 0 0 1-4 4H8l-4 3v-7a4 4 0 0 1-2-3.5v-5A4 4 0 0 1 6 3h10a4 4 0 0 1 4 4v8Z"/></symbol><symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18"/></symbol><symbol id="i-gift" viewBox="0 0 24 24"><path d="M3 10h18v11H3zM12 10v11M2 6h20v4H2zM12 6H8.5a2.5 2.5 0 1 1 2.5-2.5V6Zm0 0h3.5A2.5 2.5 0 1 0 13 3.5V6Z"/></symbol><symbol id="i-pin" viewBox="0 0 24 24"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></symbol><symbol id="i-note" viewBox="0 0 24 24"><path d="M5 3h14v18H5zM8 8h8m-8 4h8m-8 4h5"/></symbol><symbol id="i-truck" viewBox="0 0 24 24"><path d="M3 6h11v11H3zM14 10h4l3 3v4h-7zM7 20a2 2 0 1 0 0-4 2 2 0 0 0 0 4Zm10 0a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></symbol><symbol id="i-lock" viewBox="0 0 24 24"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol><symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4.2 4.2L19 6.5"/></symbol>
  </defs></svg>
  <div class="shell"><header class="top"><a class="brand" href="/quiz">reconcilia <i>♥</i></a><select class="locale" id="language-switch" aria-label="Language"><option value="en">EN</option><option value="es">ES</option><option value="pt">PT</option></select></header></div>
  <div class="progress"><b id="progress"></b></div>
  <main class="shell stage" id="app" aria-live="polite"></main>
<script>
  const icons = name => `<svg class="icon" aria-hidden="true"><use href="#i-${name}"></use></svg>`;
  const supported = { en: 1, es: 1, pt: 1 };
  function detectLanguage() { try { const saved = localStorage.getItem('reconcilia-lang'); if (saved && supported[saved]) return saved; } catch (_) {} const languages = navigator.languages || [navigator.language || 'en']; return languages.map(value => value.toLowerCase().slice(0, 2)).find(value => supported[value]) || 'en'; }
  let language = detectLanguage(); document.documentElement.lang = language === 'pt' ? 'pt-BR' : language;
  const switcher = document.getElementById('language-switch'); switcher.value = language; switcher.addEventListener('change', event => { language = event.target.value; localStorage.setItem('reconcilia-lang', language); document.documentElement.lang = language === 'pt' ? 'pt-BR' : language; });
  const state = { step: 1, reason: '', feeling: '', box: null, zip: '', delivery: null, note: '', paymentReady: false };
  const reasons = [
    ['fight', 'We had a fight', 'I need to make things right.', 'chat'], ['surprise', 'I want to surprise her', 'No occasion. Just because.', 'spark'], ['miss', 'I miss her', 'I want her to feel close.', 'heart'], ['forgot', 'I forgot an important date', 'I need to save the moment.', 'calendar'], ['care', 'I want to show I care', 'I want her to feel remembered.', 'gift']
  ];
  const feelings = [
    ['happy', 'I want her to be happy', 'spark'], ['thinking', 'I want her to know I’m thinking about her', 'heart'], ['talk', 'I want her to talk to me again', 'chat'], ['sorry', 'I want to show I’m truly sorry', 'heart'], ['special', 'I want to make this moment special', 'gift'], ['unknown', 'I don’t know, I just need to do something', 'spark']
  ];
  const boxes = [
    ['The Sweet One', 59, 'box-sweet-one.jpg', 'A small gesture that still says a lot.', 'Teddy bear, Nutella, Ferrero Rocher, Milka and Snickers'], ['The Little Gesture', 99, 'box-little-gesture.jpeg', 'Flowers, sweets and a softer way back in.', 'Teddy bear, fresh flowers, Ferrero Rocher and Milka'], ['The Apology', 179, 'box-apology.jpg', 'For when “I’m sorry” needs to feel serious.', 'Teddy bear, Welch’s, Nutella, Pringles, Lindt and Ferrero Rocher'], ['The Missing You', 229, 'box-missing-you.jpg', 'The grand gesture for a moment that really matters.', 'Teddy bear, premium chocolates, nuts, Welch’s and Nutella']
  ];
  const app = document.getElementById('app'); let stripeClient; let stripeElements; let orderId; let orderToken;
  const repair = () => state.reason === 'fight' || ['sorry', 'talk'].includes(state.feeling);
  const escapeHtml = value => String(value).replace(/[&<>"']/g, character => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[character]));
  function setStep(step) { state.step = step; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
  function selectAnswer(type, value) { state[type] = value; setStep(type === 'reason' ? 2 : 3); }
  function selectBox(index) { state.box = index; setStep(4); }
  function checkZip() { const zip = document.getElementById('zip').value.replace(/\D/g, ''); const valid = /^(327|328|338|347)/.test(zip) && zip.length === 5; document.getElementById('zip-error').textContent = valid ? '' : 'We’re not currently delivering to this ZIP code. Try another nearby ZIP code.'; if (valid) { state.zip = zip; setStep(5); } }
  function etNow() { const format = new Intl.DateTimeFormat('en-US', { timeZone: 'America/New_York', hour12: false, weekday: 'long', hour: '2-digit', minute: '2-digit' }); const data = Object.fromEntries(format.formatToParts(new Date()).filter(part => part.type !== 'literal').map(part => [part.type, part.value])); return { minutes: Number(data.hour) * 60 + Number(data.minute), day: data.weekday }; }
  function deliverySlots() { const now = etNow(); const windows = [[8, '8:00 AM to 11:00 AM'], [11, '11:00 AM to 2:00 PM'], [14, '2:00 PM to 5:00 PM'], [17, '5:00 PM to 8:00 PM'], [20, '8:00 PM to 11:00 PM']]; const available = windows.filter(([hour]) => hour * 60 >= now.minutes + 300).map(([, label]) => ({ day: 'Today', label })); if (available.length) return available; return [{ day: 'Tomorrow', label: '8:00 AM to 11:00 AM' }, { day: 'Tomorrow', label: '11:00 AM to 2:00 PM' }, { day: 'Tomorrow', label: '2:00 PM to 5:00 PM' }]; }
  function chooseDelivery(index) { state.delivery = deliverySlots()[index]; document.querySelectorAll('.slot').forEach((slot, current) => slot.classList.toggle('selected', current === index)); document.getElementById('delivery-continue').disabled = false; }
  function showFinish() { if (!state.delivery) return; setStep(6); }
  function useSuggestion(value) { state.note = value; const note = document.getElementById('note'); note.value = value; updateCount(); }
  function updateCount() { const note = document.getElementById('note'); state.note = note.value; document.getElementById('count').textContent = `${note.value.length}/180`; }
  function renderQuestion(number, title, subtitle, items, type) { return `<section class="card"><div class="step"><b>${number}</b> / 06</div><h1>${title}</h1>${subtitle ? `<p class="sub">${subtitle}</p>` : ''}<div class="choices">${items.map(item => `<button class="choice" onclick="selectAnswer('${type}','${item[0]}')"><span class="choice-icon">${icons(item[item.length - 1])}</span><span><strong>${item[1]}</strong>${type === 'reason' ? `<small>${item[2]}</small>` : ''}</span><span class="go-icon">${icons('arrow')}</span></button>`).join('')}</div></section>`; }
  function renderDelivery() { const slots = deliverySlots(); const fastest = slots[0].day.toLowerCase(); return `<section class="card"><div class="step"><b>04</b> / 06</div><div class="eyebrow">${icons('pin')} Good news, we can deliver to ${state.zip}.</div><h1>The fastest we can get there is ${fastest}.</h1><p class="sub">Every available window below begins at least five hours from now. Does this work for you?</p><div class="schedule">${slots.map((slot, index) => `<button class="slot" onclick="chooseDelivery(${index})"><b>${slot.day} · ${slot.label}</b><span>${icons('truck')} Orlando local time · delivery included</span></button>`).join('')}</div><p class="sub">Orders are prepared locally and placed into the next available route.</p><button class="back" onclick="setStep(4)">Back</button><button class="btn" id="delivery-continue" onclick="showFinish()" disabled>Continue with this delivery ${icons('arrow')}</button></section>`; }
  function summaryRows() { const box = boxes[state.box]; const delivery = state.delivery ? `${state.delivery.day}, ${state.delivery.label}` : 'Choose delivery'; return `<div class="summary-row"><span>Gift box</span><b>${box[0]}</b></div><div class="summary-row"><span>Personalized letter</span><b><span class="old">$10</span><span class="included">Included</span></b></div><div class="summary-row"><span>Local delivery</span><b><span class="old">$19</span><span class="included">Included</span></b></div><div class="summary-row"><span>Delivery window</span><b>${delivery}</b></div><div class="summary-row total"><span>Total</span><b>$${box[1]}</b></div>`; }
  function renderFinish() { const placeholder = repair() ? 'I know I hurt you. I’m sorry. I care about you and I want to make things right…' : 'No special occasion. I just wanted to remind you how special you are…'; return `<section class="finish"><div class="step"><b>05</b> / 06</div><h1>Now write what you really mean.</h1><p class="sub">The box gets her attention. Your words are what she’ll remember.</p><div class="finish-grid"><div><div class="letter-panel"><div class="letter-title">${icons('note')} Her personalized letter</div><div class="letter"><textarea id="note" maxlength="180" placeholder="${placeholder}" oninput="updateCount()">${escapeHtml(state.note)}</textarea><span class="count" id="count">${state.note.length}/180</span></div></div><div class="suggestions"><button class="suggestion" onclick="useSuggestion('I know I hurt you. I’m sorry. I don’t expect this to fix everything, but I want you to know that I care.')">Use apology suggestion</button><button class="suggestion" onclick="useSuggestion('No special occasion. I just wanted to make you smile and remind you how special you are.')">Use surprise suggestion</button></div></div><aside class="checkout-card"><h3>Send her something real.</h3>${summaryRows()}<div class="situation">${icons('heart')}<span><b>Two extras are on us.</b><br>Because this moment matters, we included the $19 local delivery and $10 personalized letter at no extra cost.</span></div><div class="payment"><h4>Delivery details</h4><div class="two"><div class="field"><label>Her name</label><input id="recipientName"></div><div class="field"><label>Your name</label><input id="senderName"></div></div><div class="field"><label>Her delivery address</label><input id="address"></div><div class="two"><div class="field"><label>City</label><input id="city" value="Orlando"></div><div class="field"><label>State</label><input id="region" value="FL"></div></div><div class="field"><label>Your email for updates</label><input id="email" type="email" placeholder="you@example.com"></div><h4>Secure payment</h4><div id="payment-element" class="field"><p style="font-size:12px">Confirm your delivery details to load the secure card form.</p></div><p class="secure">${icons('lock')} Your payment is encrypted and processed securely by Stripe.</p><p id="payment-error" class="error"></p><button class="btn pay-button" id="pay-button" onclick="submitPayment()">Continue to secure payment ${icons('arrow')}</button></div></aside></div><button class="back" onclick="setStep(5)">Back</button></section>`; }
  async function submitPayment() { const error = document.getElementById('payment-error'); const button = document.getElementById('pay-button'); error.textContent = ''; if (!state.note.trim()) { error.textContent = 'Write your note before continuing.'; document.getElementById('note').focus(); return; } if (stripeElements) { button.disabled = true; const result = await stripeClient.confirmPayment({ elements: stripeElements, confirmParams: { return_url: location.origin + '/success' }, redirect: 'if_required' }); button.disabled = false; if (result.error) { error.textContent = result.error.message; return; } setStep(7); return; } const required = ['recipientName', 'senderName', 'address', 'email']; const missing = required.find(id => !document.getElementById(id).value.trim()); if (missing) { document.getElementById(missing).focus(); error.textContent = 'Please complete the delivery details.'; return; } button.disabled = true; button.textContent = 'Preparing secure payment…'; try { const orderResponse = await fetch('/api/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ packageName: boxes[state.box][0], note: state.note.trim(), recipientName: document.getElementById('recipientName').value, recipientAddress: document.getElementById('address').value, recipientCity: document.getElementById('city').value, recipientState: document.getElementById('region').value, recipientZip: state.zip, deliveryDate: state.delivery.day, deliveryWindow: state.delivery.label, senderName: document.getElementById('senderName').value, senderEmail: document.getElementById('email').value }) }); const order = await orderResponse.json(); if (!orderResponse.ok) throw new Error(order.error || 'Could not save your order.'); orderId = order.orderId; orderToken = order.orderToken; const config = await (await fetch('/api/config')).json(); if (!config.publishableKey || !window.Stripe) throw new Error('Secure payment is not configured yet. Please try again later.'); const intentResponse = await fetch('/api/create-payment-intent', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ orderId, orderToken }) }); const intent = await intentResponse.json(); if (!intentResponse.ok) throw new Error(intent.error || 'Could not start payment.'); stripeClient = Stripe(config.publishableKey); stripeElements = stripeClient.elements({ clientSecret: intent.clientSecret, appearance: { theme: 'stripe', variables: { colorPrimary: '#b93632', colorBackground: '#fffdf9', colorText: '#17120f', fontFamily: 'DM Sans, Arial, sans-serif' } } }); stripeElements.create('payment').mount('#payment-element'); button.disabled = false; button.textContent = `Send my gift ${state.delivery.day.toLowerCase()} · $${boxes[state.box][1]}`; } catch (exception) { error.textContent = exception.message || 'Something went wrong. Please try again.'; button.disabled = false; button.textContent = 'Continue to secure payment'; } }
  function render() { document.getElementById('progress').style.width = ({ 1: 16, 2: 32, 3: 48, 4: 64, 5: 80, 6: 92, 7: 100 }[state.step] || 0) + '%'; if (state.step === 1) app.innerHTML = renderQuestion('01', 'What brings you here today?', '', reasons, 'reason'); if (state.step === 2) app.innerHTML = renderQuestion('02', 'What do you want her to feel?', 'The best gift is the one that knows what it’s there to say.', feelings, 'feeling'); if (state.step === 3) app.innerHTML = `<section class="card"><div class="step"><b>03</b> / 06</div><h1>How big should the gesture feel?</h1><p class="sub">Be honest: is this a small gesture or a “wow, he really means it” moment?</p><div class="choices packages">${boxes.map((box, index) => `<button class="box" onclick="selectBox(${index})">${index === 2 ? '<span class="tag">MOST CHOSEN FOR APOLOGIES</span>' : ''}<img src="/images/${box[2]}" alt="${box[0]} gift box"><div class="box-copy"><span class="price">$${box[1]}</span><h3>${box[0]}</h3><p>${box[3]}</p><ul><li>${box[4]}</li><li>Personalized letter included</li></ul></div></button>`).join('')}</div><button class="back" onclick="setStep(2)">Back</button></section>`; if (state.step === 4) { const copy = repair() ? ['We understand.', 'When things get complicated, it’s hard to know what to say, or how to start fixing it. You deserve a little help making this moment feel right.', 'Your personalized letter is on us.'] : ['That’s a beautiful reason to send a gift.', 'The fact that you’re taking the time to do this already says a lot.', 'We’ll include a personalized letter at no extra cost.']; app.innerHTML = `<section class="card empathy"><div class="eyebrow">A little extra care</div><h2>${copy[0]}</h2><p>${copy[1]}</p><div class="offer">${icons('note')}<div><b>${copy[2]}</b><span>Normally $10. We’ll print your words on real gift paper and place it inside the box for her to find first.</span></div></div><div class="offer">${icons('truck')}<div><b>Local delivery is on us too.</b><span>Normally $19. For this situation, delivery is included with your gift.</span></div></div><button class="btn" onclick="setStep(5)">${icons('pin')} Check delivery for her</button></section>`; } if (state.step === 5) app.innerHTML = renderDelivery(); if (state.step === 6) app.innerHTML = renderFinish(); if (state.step === 7) { const box = boxes[state.box]; app.innerHTML = `<section class="card done"><div class="done-mark">${icons('check')}</div><div class="eyebrow">Order confirmed</div><h1>Your gesture is on its way.</h1><p class="sub">We’re preparing ${box[0]} with your words inside. She’ll receive it ${state.delivery.day.toLowerCase()}, between ${state.delivery.label}.</p><div class="summary">${summaryRows()}</div><p><i>Sometimes the smallest decision is the beginning of the conversation.</i></p></section>`; } }
  render();
</script>
