<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>reconcilia — Funnel</title>
  <link rel="stylesheet" href="/admin/shared.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">reconcilia <span>&hearts;</span></div>
      <nav>
        <a href="/admin/">Orders</a>
        <a href="/admin/funnel" class="active">Funnel</a>
        <a href="/admin/sessions">Sessions</a>
      </nav>
    </aside>
    <div class="content">
      <div class="page-head">
        <h1>Funnel</h1>
        <button onclick="location.reload()">Refresh</button>
      </div>
      <main>
        <section class="panel">
          <h2>Where visitors drop off</h2>
          <div id="funnel-stats" class="stats" style="margin-bottom:16px"></div>
          <div id="funnel-chart">Loading…</div>
        </section>
        <section class="panel">
          <h2>By box — chosen vs. purchased</h2>
          <div id="funnel-packages">Loading…</div>
        </section>
      </main>
    </div>
  </div>

  <script src="/admin/shared.js"></script>
  <script>
    async function loadFunnel(){
      const chart = document.getElementById('funnel-chart');
      try {
        const res = await fetch('/api/admin/funnel');
        if(res.status === 401){ chart.innerHTML = '<div class="empty">Not authorized.</div>'; return; }
        if(!res.ok){ chart.innerHTML = '<div class="empty">Could not load funnel data.</div>'; return; }
        const data = await res.json();
        document.getElementById('funnel-stats').innerHTML = `
          <div class="stat"><b>${esc(data.totalSessions)}</b><span>Visitor sessions tracked</span></div>
          <div class="stat"><b>${esc(fmtDuration(data.avgSecondsOnPage))}</b><span>Avg. time on page</span></div>
        `;
        if(!data.totalSessions){
          chart.innerHTML = '<div class="empty">No visitor activity tracked yet.</div>';
          document.getElementById('funnel-packages').innerHTML = '<div class="empty">No box selected yet.</div>';
          return;
        }
        const maxCount = data.steps[0].count || 1;
        chart.innerHTML = data.steps.map((s, i) => {
          const pct = Math.round((s.count / maxCount) * 100);
          const prev = i > 0 ? data.steps[i - 1].count : null;
          const dropOff = prev ? Math.round(((prev - s.count) / prev) * 100) : null;
          return `
            <div class="funnel-row">
              <span>${esc(s.label)}</span>
              <div class="track"><div class="fill" style="width:${pct}%"></div></div>
              <span class="count">${esc(s.count)}${dropOff !== null && dropOff > 0 ? `<br><span class="drop">-${dropOff}%</span>` : ''}</span>
            </div>
          `;
        }).join('');

        const packagesEl = document.getElementById('funnel-packages');
        if(!data.packages || !data.packages.length){
          packagesEl.innerHTML = '<div class="empty">No box selected yet.</div>';
        } else {
          const maxChosen = Math.max(...data.packages.map(p => p.chosen), 1);
          packagesEl.innerHTML = data.packages.map(p => {
            const pct = Math.round((p.chosen / maxChosen) * 100);
            const rate = p.chosen ? Math.round((p.purchased / p.chosen) * 100) : 0;
            return `
              <div class="funnel-row">
                <span>${esc(p.packageName)}</span>
                <div class="track"><div class="fill" style="width:${pct}%"></div></div>
                <span class="count">${esc(p.purchased)}/${esc(p.chosen)}<br><span style="color:var(--muted);font-size:11px">${rate}% bought</span></span>
              </div>
            `;
          }).join('');
        }
      } catch(err){
        chart.innerHTML = '<div class="empty">Could not load funnel data.</div>';
      }
    }

    loadFunnel();
  </script>
</body>
</html>
