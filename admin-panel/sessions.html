<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>reconcilia — Sessions</title>
  <link rel="stylesheet" href="/admin/shared.css" />
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">reconcilia <span>&hearts;</span></div>
      <nav>
        <a href="/admin/">Orders</a>
        <a href="/admin/funnel">Funnel</a>
        <a href="/admin/sessions" class="active">Sessions</a>
      </nav>
    </aside>
    <div class="content">
      <div class="page-head">
        <h1>Sessions</h1>
        <button onclick="location.reload()">Refresh</button>
      </div>
      <main>
        <div id="stats" class="stats"></div>
        <div id="content">Loading sessions…</div>
      </main>
    </div>
  </div>

  <script src="/admin/shared.js"></script>
  <script>
    async function load(){
      const content = document.getElementById('content');
      try {
        const res = await fetch('/api/admin/sessions');
        if(res.status === 401){ content.innerHTML = '<div class="empty">Not authorized.</div>'; return; }
        if(!res.ok){ content.innerHTML = '<div class="empty">Could not load sessions.</div>'; return; }
        const sessions = await res.json();
        renderStats(sessions);
        renderTable(sessions);
      } catch(err){
        content.innerHTML = '<div class="empty">Could not load sessions.</div>';
      }
    }

    function isFromAds(s){
      return Boolean(s.fbclid) || /facebook|instagram|meta|fb|ig/i.test(s.utm_source || '');
    }

    function sourceLabel(s){
      if(s.utm_source){
        return esc(s.utm_source) + (s.utm_campaign ? ' &middot; ' + esc(s.utm_campaign) : '');
      }
      if(s.fbclid) return 'Meta Ads <span style="color:var(--muted);font-size:11px">(auto)</span>';
      return '<span style="color:var(--muted)">Direct / organic</span>';
    }

    const QUIZ_LABELS = {
      recipient: { her: 'For her', him: 'For him', private: 'Private' },
      reason: { fight: 'Had a fight', surprise: 'Surprise', miss: 'Misses them', forgot: 'Forgot a date', care: 'Show care' },
      feeling: { happy: 'Happy', thinking: 'Thinking of them', talk: 'Talk again', sorry: 'Truly sorry', special: 'Special moment', unknown: 'Unsure' },
    };

    function pageLabel(s){
      if(s.entry_page === 'quiz') return '<span class="badge paid">Quiz</span>';
      if(s.entry_page === 'home') return '<span class="badge pending">Home</span>';
      return '<span style="color:var(--muted)">—</span>';
    }

    function quizAnswers(s){
      const parts = [
        QUIZ_LABELS.recipient[s.quiz_recipient],
        QUIZ_LABELS.reason[s.quiz_reason],
        QUIZ_LABELS.feeling[s.quiz_feeling],
      ].filter(Boolean);
      return parts.length ? esc(parts.join(' · ')) : '<span style="color:var(--muted)">—</span>';
    }

    function renderStats(sessions){
      const withZip = sessions.filter(s => s.zip_checked).length;
      const paid = sessions.filter(s => s.order_status === 'paid').length;
      const fromAds = sessions.filter(isFromAds).length;
      const fromQuiz = sessions.filter(s => s.entry_page === 'quiz').length;
      const stats = [
        { label: 'Sessions tracked', value: sessions.length },
        { label: 'From ads', value: fromAds },
        { label: 'Via quiz', value: fromQuiz },
        { label: 'Checked a ZIP', value: withZip },
        { label: 'Paid', value: paid },
      ];
      document.getElementById('stats').innerHTML = stats.map(s =>
        `<div class="stat"><b>${esc(s.value)}</b><span>${esc(s.label)}</span></div>`
      ).join('');
    }

    function orderBadge(s){
      if(!s.order_id) return '<span class="badge pending">no</span>';
      if(s.order_status === 'paid') return `<span class="badge paid">#${esc(s.order_id)}</span>`;
      return `<span class="badge pending">#${esc(s.order_id)} unpaid</span>`;
    }

    function renderTable(sessions){
      const content = document.getElementById('content');
      if(!sessions.length){
        content.innerHTML = '<div class="empty">No sessions tracked yet.</div>';
        return;
      }
      const rows = sessions.map(s => `
        <tr>
          <td style="font-family:monospace;font-size:11px">${esc(s.id.slice(0, 8))}…</td>
          <td>${fmtDate(s.first_seen_at)}</td>
          <td>${sourceLabel(s)}</td>
          <td>${pageLabel(s)}</td>
          <td style="font-size:12px">${quizAnswers(s)}</td>
          <td>${esc(FUNNEL_STEP_LABELS[s.furthest_step] || s.furthest_step)}</td>
          <td>${esc(s.package_name) || '—'}</td>
          <td style="font-family:monospace">${esc(s.zip_checked) || '—'}</td>
          <td>${fmtDuration(s.seconds_on_page)}</td>
          <td>${orderBadge(s)}</td>
        </tr>
      `).join('');
      content.innerHTML = `
        <table>
          <thead><tr><th>Session</th><th>First seen</th><th>Source</th><th>Page</th><th>Quiz answers</th><th>Furthest step</th><th>Package</th><th>ZIP checked</th><th>Time on page</th><th>Order</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    load();
  </script>
</body>
</html>
